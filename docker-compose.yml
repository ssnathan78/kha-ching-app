services:
  postgres:
    image: postgres:16-alpine
    container_name: kha-ching-postgres
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kha-ching-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kha-ching-app
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: development
      MOCK_ORDERS: "true"
      TZ: Asia/Kolkata
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/trading_db
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: kha-ching-dev
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: development
      MOCK_ORDERS: "true"
      TZ: Asia/Kolkata
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/trading_db
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
