name: CI

on:
  push:
    branches: [master, main, modernize/**]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trading_db
      REDIS_URL: redis://127.0.0.1:6379
      SECRET_COOKIE_PASSWORD: test-secret-cookie-password-min-32-chars
      KITE_API_KEY: test_key
      KITE_API_SECRET: test_secret
      MOCK_ORDERS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn unit-test
      - run: yarn build
